<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雯谷 · 智能错题整理</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap');

body{
    margin:0;
    height:100vh;
    overflow:hidden;
    font-family:'Noto Serif SC',serif;
}

/* 背景渐变 */
body::before{
    content:"";
    position:absolute;
    inset:0;
    background: linear-gradient(135deg,#e0eaff 0%,#ffffff 100%);
    z-index:-2;
}

/* 粒子画布 */
#particleCanvas{
    position:absolute;
    inset:0;
    z-index:-1;
}

/* 内容容器 */
.container{
    position:relative;
    text-align:center;
    top:50%;
    transform:translateY(-50%);
    z-index:10;
}

/* 产品名称 */
.logo{
    font-family:'Playfair Display', serif;
    font-size:6rem;           /* 调大，视觉冲击力更强 */
    font-weight:700;
    color:#4361ee;
    letter-spacing:5px;       /* 微调字距更优雅 */
    text-shadow: 0 12px 36px rgba(67,97,238,0.3);
    margin-bottom:20px;
}

/* 副标题 */
.subtitle{
    font-size:1.6rem;        /* 略大一点，更优雅 */
    color:rgba(67,97,238,0.65);
    margin-bottom:50px;       /* 调整间距，保持层次 */
    font-weight:500;
}

/* 按钮 */
.btn-group{
    display:flex;
    justify-content:center;
}

.btn{
    padding:18px 60px;        /* 按钮更大气 */
    border-radius:60px;       /* 圆润 */
    font-size:1.25rem;        /* 更醒目 */
    font-weight:700;
    cursor:pointer;
    border:none;
    background:linear-gradient(135deg,#4361ee,#5f7cff);
    color:white;
    box-shadow: 0 16px 36px rgba(67,97,238,0.35);
    transition: all 0.3s ease;
}
.btn:hover{
    transform:translateY(-4px);
    box-shadow:0 22px 48px rgba(67,97,238,0.45);
}
</style>
</head>
<body>

<canvas id="particleCanvas"></canvas>

<div class="container">
    <div class="logo">雯谷</div>
    <div class="subtitle">温故而知新可以为师矣</div>

    <div class="btn-group">
        <button class="btn" onclick="location.href='入谷.html'">入谷</button>
    </div>
</div>

<script>
// 粒子动画
const canvas = document.getElementById('particleCanvas');
const ctx = canvas.getContext('2d');
let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;

const particles = [];
const particleCount = 80;

class Particle{
    constructor(){
        this.reset();
    }
    reset(){
        this.x = Math.random()*width;
        this.y = Math.random()*height;
        this.size = Math.random()*4 + 2;
        this.speedX = (Math.random()-0.5)*0.3;
        this.speedY = (Math.random()-0.5)*0.3;
        this.opacity = Math.random()*0.5 + 0.2;
    }
    update(){
        this.x += this.speedX;
        this.y += this.speedY;
        if(this.x<0||this.x>width||this.y<0||this.y>height) this.reset();
    }
    draw(){
        ctx.beginPath();
        ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
        ctx.fillStyle=`rgba(76,201,240,${this.opacity})`;
        ctx.fill();
    }
}

for(let i=0;i<particleCount;i++) particles.push(new Particle());

function animate(){
    ctx.clearRect(0,0,width,height);
    particles.forEach(p=>{
        p.update();
        p.draw();
    });
    requestAnimationFrame(animate);
}

animate();

window.addEventListener('resize',()=>{
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
});
</script>
</body>
</html>
